# Kruger Lab System v2.0 - Advanced Settings
# ملف الإعدادات المتقدمة للإصدار 2.0

[GENERAL]
# إعدادات عامة
app_name = Kruger Lab System
version = 2.0.0
author = Kruger Lab
description = نظام إدارة المعمل المتكامل - الإصدار 2.0

[FEATURES]
# تفعيل/تعطيل الميزات
calendar_enabled = true
auto_backup = true
logging_enabled = true
arabic_support = true

[PATHS]
# مسارات إضافية
backup_dir = D:\Plant Reports\Backup
temp_dir = D:\Plant Reports\Temp
log_dir = D:\Plant Reports\Logs

[BACKUP]
# إعدادات النسخ الاحتياطي
backup_interval_days = 7
max_backup_files = 10
backup_on_exit = true

[UI]
# إعدادات الواجهة
default_font = Arial
font_size = 18
theme = default
show_tooltips = true

[LOGGING]
# إعدادات السجل
log_level = INFO
log_max_size_mb = 10
log_backup_count = 5

[SECURITY]
# إعدادات الأمان
password_min_length = 8
session_timeout_minutes = 30
encrypt_sensitive_data = true

[PERFORMANCE]
# إعدادات الأداء
max_memory_usage_mb = 512
cleanup_temp_files = true
optimize_images = true